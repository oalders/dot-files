exclude = [ ".tmp/**" ]

# Shell scripts: anything in bin/ that isn't Perl or AppleScript, plus rc files
# that have a shell shebang. test/precious-coverage.bats fails on any script
# this misses.
[commands.shfmt]
type = "both"
include = [
    "**/*.bash",
    "**/*.bats",
    "**/*.sh",
    ".githooks/pre-commit",
    "bash_profile",
    "bashrc-docker",
    "bin/*",
    "sketchybar/sketchybarrc",
    "ssh/rc",
]
exclude = [ "bin/*.pl", "bin/*.scpt", "bin/gh" ]
cmd = [ "shfmt" ]
# Style comes from editorconfig; any formatting flag here would override it.
lint_flags = "-d"
tidy_flags = "-w"
ok_exit_codes = [0]
lint_failure_exit_codes = [1]

[commands.shellcheck]
type = "lint"
include = [
    "**/*.bash",
    "**/*.bats",
    "**/*.sh",
    ".githooks/pre-commit",
    "bash_profile",
    "bashrc-docker",
    "bin/*",
    "sketchybar/sketchybarrc",
    "ssh/rc",
]
exclude = [ "bin/*.pl", "bin/*.scpt", "bin/gh" ]
cmd = [ "shellcheck", "-x" ]
ok_exit_codes = [0]
lint_failure_exit_codes = [1]

[commands.stylua]
type = "both"
include = "**/*.lua"
cmd = [ "stylua" ]
lint_flags = "--check"
ok_exit_codes = [0]
lint_failure_exit_codes = [1]

[commands.perlimports]
type = "both"
include = [
    "**/*.pl",
    "**/*.pm",
    "**/*.t",
    "bin/gh",
    "dzil/profiles/default/skel/git/hooks/pre-commit",
    "re.pl/repl.rc",
]
cmd = [ "perlimports" ]
lint_flags = [ "--lint" ]
tidy_flags = [ "-i" ]
ok_exit_codes = [0]
lint_failure_exit_codes = [1]
expect_stderr = true

[commands.perltidy]
type = "both"
include = [
    "**/*.pl",
    "**/*.pm",
    "**/*.t",
    "bin/gh",
    "dzil/profiles/default/skel/git/hooks/pre-commit",
    "re.pl/repl.rc",
]
cmd = [ "perltidy", "--profile=$PRECIOUS_ROOT/perltidyrc" ]
lint_flags = [ "--assert-tidy", "--no-standard-output", "--outfile=/dev/null" ]
tidy_flags = [ "--backup-and-modify-in-place", "--backup-file-extension=/" ]
ok_exit_codes = [0]
lint_failure_exit_codes = [2]
expect_stderr = true

[commands.perlcritic]
type = "lint"
include = [
    "**/*.pl",
    "**/*.pm",
    "**/*.t",
    "bin/gh",
    "dzil/profiles/default/skel/git/hooks/pre-commit",
    "re.pl/repl.rc",
]
cmd = [ "perlcritic", "--profile=$PRECIOUS_ROOT/perlcriticrc" ]
ok_exit_codes = [0]
lint_failure_exit_codes = [2]
