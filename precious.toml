[commands.shfmt]
type     = "both"
include  = [ "**/*.sh", "bin/merge-pr" ]
cmd = [ "shfmt" ]
ok_exit_codes = [0]
lint_failure_exit_codes = [1]
lint_flags  = "--diff"
tidy_flags  = ["-w", "-s", "-i", "4"]

[commands.stylua]
cmd = [ "stylua" ]
type = "both"
include = "**/*.lua"
ok_exit_codes = [0]
lint_failure_exit_codes = [1]
lint_flags = "--check"
