set -g update-environment 'DISPLAY SSH_AUTH_SOCK'

# Load sensible first during tpack initialization at the bottom of this file.
# It supplies focus-events, aggressive-resize, and prefix + prefix passthrough.
set -g @plugin 'tmux-plugins/tmux-sensible#v3.0.0'

# Change session order back to alphabetical
# https://stackoverflow.com/a/63854302/406224
bind s choose-tree -sZ -O name

# ctrl-a beats ctrl-b
unbind C-b
set -g prefix C-a

# window split commands i can actually remember
unbind %
bind-key | split-window -h -c "#{pane_current_path}"
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key _ split-window -v -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Terminal advertised to applications inside tmux.
set -g default-terminal "tmux-256color"

# Capabilities of the outer terminal: true colour and styled/coloured underlines.
# tmux-256color covers nested tmux sessions.
set -as terminal-features ',tmux-256color:RGB:usstyle,xterm-256color:RGB:usstyle,alacritty:RGB:usstyle'

# Pass OSC 8 hyperlinks through to the outer terminal (requires tmux 3.4+).
# Without this, tmux strips clickable links (e.g. from bin/gh-triage).
set -as terminal-features ',*:hyperlinks'

# `-q` sources the file only if it exists (no error otherwise), the tmux-native
# equivalent of an `if-shell [ -f ... ]` guard. tpack's config parser rejects a
# source-file nested in an if-shell quoted command list, so keep this top-level.
source-file -q ~/.local/share/nvim/lazy/tokyonight.nvim/extras/tmux/tokyonight_moon.tmux

# Override the "bold" in tokyonight_moon status-left
set -g status-left "#[fg=#1b1d2b,bg=#82aaff] #{=/60/…:session_name} #[fg=#82aaff,bg=#1e2030,nobold,nounderscore,noitalics]"

# reload config
bind r source-file ~/.tmux.conf \; display-message -d 3000 '🍭 Config reloaded!'
bind h select-layout even-horizontal
bind v select-layout even-vertical

set -g history-limit 100000

# Set status bar
set -g status-interval 300

# use Ctrl-n to swap panes
# use arrow keys to cycle panes
bind-key C-n swap-pane -s :+.top \; rotate-window -Ut :+

# https://waylonwalker.com/tmux-killing-tmux/
bind k display-popup -w 95% -h 95% -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    fzf --reverse -m --header=kill-session |\
    xargs -I {} tmux kill-session -t {}"

set-option -g status-left-length 80
set-option -g status-right-length 40

# Preserve the active pane's default-text highlight.
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=colour250,bg=default'

# A bright TokyoNight blue border marks the active pane, including in full-screen apps.
set -g pane-border-style fg=#292e42,bg=#1f2335
set -g pane-active-border-style fg=#82aaff,bg=#24283b

# Only show the top border in windows with more than one pane.
set -gw pane-border-status off
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'
# Keep tmux's directional arrows and add quiet markers across the active top border.
set -g pane-border-indicators both
set -g pane-border-format '#{?pane_active,#[align=centre]↓#[align=right]↓,}'
# Change border style (options: single, double, heavy, simple, number, none)
set -g pane-border-lines 'heavy'

# set previously-active window title colors
set-option -g window-status-last-style fg=colour50

# The default "reverse" bell style inverts the tab, turning its arrows into a block.
set-option -g window-status-bell-style "fg=#ff757f,bold"

# use a later bash: $SHELL is the login shell (Homebrew bash 5+), whereas
# `env bash` resolves to /bin/bash (3.2 on macOS) in tmux's minimal PATH,
# which breaks oh-my-posh's init (it uses bash 4.2+ `[[ -v ... ]]` syntax).
set-option -g default-command '${SHELL} -i'

# Maybe reduce lag
# https://github.com/tmux/tmux/issues/353#issuecomment-294570322
set-option -s escape-time 10

# Enable using the mouse to resize panes
# https://superuser.com/a/1017275/120685
#
# Toggle mouse rather than automatically turning it on. We do this to avoid
# constantly having to shift-click just to copy text.
# https://stackoverflow.com/a/65153140/406224
# Key binding: ctrl-a a
bind-key a set-option -g mouse \; display-message '🐭 Mouse #{?mouse,on,off}'

set -g set-clipboard on

# Customize popup window borders
set -g popup-border-style fg=#394b70,bg=#1f2335
set -g popup-border-lines "rounded"

bind-key c-P display-popup -E "tmux new-session -A -s scratch"

bind-key ` display-popup -w 95% -h 95% -E tm

set-option -g status-right "#{?mouse,🐭,} #h | 💾 #{continuum_status}m"

# required for folke/zen-mode.nvim
set-option -g allow-passthrough on

# tmux-continuum needs to be the last plugin in this list
# See https://github.com/tmux-plugins/tmux-continuum#known-issues
set -g @plugin 'tmux-plugins/tmux-yank#v2.3.0'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-sessionist#v2.3.0'
set -g @plugin 'alexwforsythe/tmux-which-key' # prefix + space
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'

TMUX_FZF_LAUNCH_KEY="f"
TMUX_FZF_MENU="switch session\n/$HOME/.tmux/plugins/tmux-fzf/scripts/session.sh switch\n"

set -g @continuum-restore 'on'
set -g @continuum-save-interval '60' # time is measured in minutes (60 = 1 hour)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.cache/tmux/resurrect'

# configure/tmux.sh installs and repairs tpack.
# Initialize tpack (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
