---
name: Build

on:
  - pull_request
  - push

permissions:
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    if: >
      ${{
      ( github.actor == 'dependabot[bot]' &&
        github.event_name == 'pull_request' ) ||
      ( github.actor != 'dependabot[bot]' &&
        github.event_name == 'push' )
      }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.5'

      - name: Set up symlink to ~/dot-files
        run: cd && ln -s $GITHUB_WORKSPACE .

      - name: Tolerate a slow/flaky apt mirror
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-retries
          echo 'Acquire::http::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/99-retries

      - name: Make the apt archive cache dir writable
        # /var/cache/apt/archives is root:root drwxr-xr-x; actions/cache
        # restores as the unprivileged runner user, which can't write new
        # .deb files into it unless we open it up first.
        run: sudo chmod -R 777 /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-${{ hashFiles('installer/linux.sh') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install tmux deps
        # The runner image's package index goes stale; without an update apt
        # requests superseded .debs that the mirror has dropped (404).
        run: sudo apt-get update && sudo apt-get install -y libevent-dev

      - name: Install
        run: ./install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREFER_PKGS: 1

      - name: Put installed tools on PATH
        run: echo "$HOME/local/bin" >> "$GITHUB_PATH"

      - name: Run bats
        # tag-release tests would otherwise write to this job's real outputs.
        run: env -u GITHUB_OUTPUT -u GITHUB_STEP_SUMMARY node_modules/.bin/bats test/
